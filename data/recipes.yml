    - 기름 두른 팬에 중약불로 앞뒤를 노릇하게 부침

- name: 브로콜리마늘볶음
  servings: 2
  time: 10분
  tags: [반찬]
  ingredients:
    - {item: 브로콜리, qty: 1, unit: 개, main: true}
