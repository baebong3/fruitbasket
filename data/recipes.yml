    - 쪽파를 넣고 버무려 통깨로 마무리

- name: 소고기무국
  servings: 4
  time: 30분
  tags: [국]
  ingredients:
    - {item: 무, qty: 0.4, unit: 개, main: true}
    - {item: 파, kind: 대파, qty: 40, unit: g}
    - {item: 깐마늘(국산), qty: 2, unit: 쪽}
  staples: [{name: 소고기(국거리), qty: 150, unit: g}]
  seasoning: [국간장, 참기름, 소금, 물 6컵]
  steps:
    - 참기름에 소고기를 볶다 나박 썬 무를 넣고 함께 볶음
    - 물을 붓고 마늘을 넣어 15분 끓임
    - 국간장·소금으로 간하고 대파를 넣음

- name: 가지볶음
  servings: 3
  time: 15분
  tags: [반찬]
  ingredients:
    - {item: 가지, qty: 3, unit: 개, main: true}
    - {item: 파, kind: 대파, qty: 30, unit: g}
    - {item: 깐마늘(국산), qty: 2, unit: 쪽}
    - {item: 풋고추, kind: 청양고추, qty: 1, unit: 개}
  seasoning: [간장, 굴소스, 설탕, 식용유, 참기름]
