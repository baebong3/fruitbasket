    - 육수에 된장을 풀고 배추·마늘을 넣어 15분 끓임
    - 대파를 넣고 국간장으로 간을 맞춤

- name: 양배추쌈과 강된장
  servings: 3
  time: 20분
  tags: [쌈, 반찬]
  ingredients:
    - {item: 양배추, qty: 0.5, unit: 포기, main: true}
    - {item: 양파, qty: 100, unit: g}
    - {item: 풋고추, kind: 청양고추, qty: 2, unit: 개}
    - {item: 호박, kind: 애호박, qty: 0.3, unit: 개}
    - {item: 깐마늘(국산), qty: 2, unit: 쪽}
  seasoning: [된장, 고추장, 참기름, 물 1컵]
  steps:
    - 양배추를 잎째 찜기에 7분 쪄서 식힘
    - 양파·애호박·청양고추·마늘을 잘게 다져 된장·고추장과 함께 자작하게 끓임
    - 찐 양배추에 밥과 강된장을 올려 쌈으로 먹음

- name: 무생채
  servings: 4
  time: 15분
  tags: [반찬, 불 없이]
  ingredients:
    - {item: 무, qty: 0.5, unit: 개, main: true}
    - {item: 파, kind: 쪽파, qty: 30, unit: g}
    - {item: 깐마늘(국산), qty: 2, unit: 쪽}
    - {item: 고춧가루, kind: 국산, qty: 15, unit: g}
  seasoning: [소금, 설탕, 식초, 액젓, 통깨]
  steps:
    - 무를 가늘게 채 썰어 소금에 10분 절이고 물기를 짬
