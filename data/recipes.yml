# 알뜰 요리 레시피 - KAMIS 조사 품목으로 만드는 집밥
# item: KAMIS 품목명, kind: 품종(비우면 가장 싼 품종 자동), qty + unit(g|개|포기|장|대|쪽|줌)
# main: true 인 재료가 그날 평년보다 싸야 추천 후보에 오름. staples 는 data/staples.yml 의 참고가 사용
# 1개 무게 등 환산 기준은 data/staples.yml 의 piece_g
# months: 제철 달 목록(선택). 적으면 그 달에만 추천 (예: 냉국·화채는 여름)
# 추천은 요리 종류(국·찌개 / 메인·한 그릇 / 반찬·김치 / 샐러드·디저트)와 주재료가 겹치지 않게 고르고, 최근 3일 추천은 뒤로 미룸

- name: 오이무침
  servings: 2
  time: 10분
  tags: [반찬, 불 없이]
  ingredients:
    - {item: 오이, qty: 2, unit: 개, main: true}
    - {item: 파, kind: 대파, qty: 30, unit: g}
    - {item: 깐마늘(국산), qty: 2, unit: 쪽}
    - {item: 고춧가루, kind: 국산, qty: 10, unit: g}
  seasoning: [식초, 설탕, 소금, 참기름, 통깨]
  steps:
    - 오이를 어슷하게 썰어 소금 약간에 10분 절인 뒤 물기를 짬
    - 대파·마늘을 다지고 고춧가루·식초·설탕을 섞어 양념을 만듦
    - 오이에 양념을 넣고 버무린 뒤 참기름·통깨로 마무리

- name: 오이냉국
  servings: 2
  months: [6, 7, 8, 9]
  time: 10분
  tags: [국, 불 없이]
  ingredients:
    - {item: 오이, qty: 1, unit: 개, main: true}
    - {item: 양파, qty: 50, unit: g}
    - {item: 풋고추, kind: 청양고추, qty: 1, unit: 개}
  seasoning: [식초, 설탕, 소금, 국간장, 통깨, 얼음]
  steps:
    - 오이·양파를 채 썰고 청양고추는 송송 썲
    - 찬물 2컵에 식초·설탕·소금·국간장으로 간을 맞춤
    - 채소를 넣고 얼음을 띄워 냄

- name: 시금치나물
  servings: 3
  time: 15분
  tags: [반찬, 나물]
  ingredients:
    - {item: 시금치, qty: 300, unit: g, main: true}
    - {item: 깐마늘(국산), qty: 2, unit: 쪽}
    - {item: 파, kind: 대파, qty: 20, unit: g}
  seasoning: [국간장, 참기름, 소금, 통깨]
  steps:
    - 끓는 물에 소금을 넣고 시금치를 30초만 데쳐 찬물에 헹군 뒤 물기를 짬
    - 다진 마늘·대파, 국간장, 참기름, 소금으로 조물조물 무침
    - 통깨를 뿌려 냄

- name: 열무김치
  servings: 6
  time: 40분 + 숙성
  tags: [김치, 저장]
  ingredients:
    - {item: 열무, qty: 1000, unit: g, main: true}
    - {item: 파, kind: 쪽파, qty: 100, unit: g}
    - {item: 양파, qty: 100, unit: g}
    - {item: 깐마늘(국산), qty: 30, unit: g}
    - {item: 생강, qty: 5, unit: g}
    - {item: 고춧가루, kind: 국산, qty: 40, unit: g}
  seasoning: [굵은소금, 밀가루풀, 액젓, 설탕]
  steps:
    - 열무를 4cm 길이로 잘라 굵은소금에 30분 절이고 살살 헹굼
    - 밀가루풀에 고춧가루·마늘·생강·액젓·설탕을 섞고 양파는 갈아 넣음
    - 열무·쪽파에 양념을 가볍게 버무려 실온에 반나절 둔 뒤 냉장 보관

- name: 얼갈이된장국
  servings: 3
  time: 20분
  tags: [국]
  ingredients:
    - {item: 얼갈이배추, qty: 300, unit: g, main: true}
    - {item: 파, kind: 대파, qty: 30, unit: g}
    - {item: 깐마늘(국산), qty: 2, unit: 쪽}
    - {item: 풋고추, kind: 청양고추, qty: 1, unit: 개}
  staples: [{name: 두부, qty: 0.5, unit: 모}]
  seasoning: [된장, 멸치육수 또는 물 4컵]
  steps:
    - 얼갈이를 끓는 물에 살짝 데쳐 찬물에 헹구고 4cm로 썲
    - 육수에 된장을 풀고 얼갈이·마늘을 넣어 10분 끓임
    - 두부·대파·청양고추를 넣고 한소끔 더 끓임

- name: 상추겉절이
  servings: 3
  time: 10분
  tags: [반찬, 불 없이]
  ingredients:
    - {item: 상추, kind: 청, qty: 200, unit: g, main: true}
    - {item: 파, kind: 대파, qty: 20, unit: g}
    - {item: 깐마늘(국산), qty: 1, unit: 쪽}
    - {item: 고춧가루, kind: 국산, qty: 8, unit: g}
  seasoning: [액젓, 설탕, 식초, 참기름, 통깨]
  steps:
    - 상추를 씻어 물기를 털고 먹기 좋게 뜯음
    - 고춧가루·액젓·설탕·식초·다진 마늘·대파를 섞어 양념을 만듦
    - 먹기 직전에 양념을 넣고 살살 버무려 참기름·통깨로 마무리

- name: 애호박볶음
  servings: 3
  time: 15분
  tags: [반찬]
  ingredients:
    - {item: 호박, kind: 애호박, qty: 1, unit: 개, main: true}
    - {item: 양파, qty: 100, unit: g}
    - {item: 파, kind: 대파, qty: 20, unit: g}
    - {item: 깐마늘(국산), qty: 2, unit: 쪽}
  seasoning: [새우젓, 식용유, 참기름, 통깨]
  steps:
    - 애호박은 반달 모양, 양파는 채 썲
    - 기름 두른 팬에 마늘을 볶다 애호박·양파를 넣고 중불에 볶음
    - 새우젓으로 간하고 대파·참기름·통깨를 넣어 마무리

- name: 애호박된장찌개
  servings: 3
  time: 20분
  tags: [찌개]
  ingredients:
    - {item: 호박, kind: 애호박, qty: 0.5, unit: 개, main: true}
    - {item: 양파, qty: 100, unit: g}
    - {item: 풋고추, kind: 청양고추, qty: 1, unit: 개}
    - {item: 파, kind: 대파, qty: 30, unit: g}
    - {item: 깐마늘(국산), qty: 2, unit: 쪽}
  staples: [{name: 두부, qty: 0.5, unit: 모}]
  seasoning: [된장, 고춧가루 약간, 멸치육수 3컵]
  steps:
    - 육수에 된장을 풀고 양파·마늘을 넣어 끓임
    - 애호박·두부를 넣고 5분 끓임
    - 대파·청양고추를 넣고 한소끔 더 끓임

- name: 호박전
  servings: 3
  time: 20분
  tags: [전, 반찬]
  ingredients:
    - {item: 호박, kind: 애호박, qty: 1, unit: 개, main: true}
  staples: [{name: 계란, qty: 2, unit: 개}, {name: 부침가루, qty: 50, unit: g}]
  seasoning: [소금, 식용유]
  steps:
    - 애호박을 0.5cm 두께로 썰어 소금을 살짝 뿌려 둠
    - 부침가루를 묻히고 풀어 둔 계란옷을 입힘
    - 기름 두른 팬에 중약불로 앞뒤를 노릇하게 부침

- name: 브로콜리마늘볶음
  servings: 2
  time: 10분
  tags: [반찬]
  ingredients:
    - {item: 브로콜리, qty: 1, unit: 개, main: true}
    - {item: 깐마늘(국산), qty: 4, unit: 쪽}
  seasoning: [올리브유, 소금, 후추]
  steps:
    - 브로콜리를 한입 크기로 잘라 끓는 물에 1분 데침
    - 올리브유에 편 마늘을 볶아 향을 내고 브로콜리를 넣어 1~2분 볶음
    - 소금·후추로 간함

- name: 당근라페
  servings: 3
  time: 15분
  tags: [샐러드, 불 없이]
  ingredients:
    - {item: 당근, qty: 2, unit: 개, main: true}
    - {item: 레몬, qty: 0.5, unit: 개}
  seasoning: [올리브유, 홀그레인머스터드, 설탕, 소금, 후추]
  steps:
    - 당근을 가늘게 채 썰어 소금을 뿌리고 10분 두었다 물기를 짬
    - 레몬즙·올리브유·머스터드·설탕·후추를 섞어 드레싱을 만듦
    - 당근에 드레싱을 버무려 30분 재운 뒤 냄

- name: 토마토달걀볶음
  servings: 2
  time: 10분
  tags: [반찬, 한 그릇]
  ingredients:
    - {item: 토마토, qty: 400, unit: g, main: true}
    - {item: 파, kind: 대파, qty: 30, unit: g}
  staples: [{name: 계란, qty: 3, unit: 개}]
  seasoning: [식용유, 소금, 설탕 약간, 굴소스]
  steps:
    - 토마토는 한입 크기로 썰고 계란은 소금 약간 넣어 풀어 둠
    - 기름 두른 팬에 계란을 부드럽게 스크램블해 덜어 둠
    - 같은 팬에 대파·토마토를 볶다 계란을 넣고 굴소스·설탕으로 간함

- name: 방울토마토 마리네이드
  servings: 3
  time: 15분 + 재우기
  tags: [샐러드, 불 없이]
  ingredients:
    - {item: 방울토마토, qty: 500, unit: g, main: true}
    - {item: 양파, qty: 50, unit: g}
    - {item: 레몬, qty: 0.5, unit: 개}
  seasoning: [올리브유, 발사믹식초, 꿀, 소금, 후추, 바질]
  steps:
    - 방울토마토는 십자로 칼집을 내 끓는 물에 10초 데쳐 껍질을 벗김
    - 다진 양파, 레몬즙, 올리브유, 발사믹, 꿀, 소금·후추를 섞음
    - 토마토에 부어 냉장고에서 2시간 이상 재움

- name: 배추전
  servings: 3
  time: 20분
  tags: [전]
  ingredients:
    - {item: 알배기배추, qty: 0.5, unit: 포기, main: true}
    - {item: 풋고추, kind: 청양고추, qty: 1, unit: 개}
  staples: [{name: 부침가루, qty: 100, unit: g}]
  seasoning: [식용유, 간장, 식초]
  steps:
    - 배추 잎을 한 장씩 떼어 줄기 부분을 칼등으로 두드려 펴 줌
    - 부침가루를 물에 묽게 풀어 배추를 담갔다 꺼냄
    - 기름 두른 팬에 노릇하게 부치고 초간장을 곁들임

- name: 배추된장국
  servings: 4
  time: 25분
  tags: [국]
  ingredients:
    - {item: 배추, qty: 600, unit: g, main: true}
    - {item: 파, kind: 대파, qty: 30, unit: g}
    - {item: 깐마늘(국산), qty: 3, unit: 쪽}
  seasoning: [된장, 멸치육수 5컵, 국간장]
