name: 매일 가격 수집·리포트

on:
  schedule:
    # 매일 18:07 KST (09:07 UTC). KAMIS 당일 가격 발표 이후
    - cron: "7 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "특정 조사일만 수집 (YYYY-MM-DD, 비우면 최신)"
        required: false

permissions:
  contents: write

concurrency:
  group: fruitbasket-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: KAMIS 수집
        id: collect
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
          KAMIS_PROXY_URL: ${{ secrets.KAMIS_PROXY_URL }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python scripts/collect.py --date "${{ inputs.date }}"
          else
            python scripts/collect.py
          fi

      - name: 리포트 생성
        if: steps.collect.outputs.new_data == 'true' || github.event_name == 'workflow_dispatch'
        run: python scripts/report.py

      - name: 커밋·푸시
        run: |
          git config user.name "fruitbasket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "가격 업데이트 ${{ steps.collect.outputs.date }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
