name: 과거 가격 백필 (수동)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "어제부터 거슬러 채울 일수"
        default: "365"
        required: true

permissions:
  contents: write

concurrency:
  group: fruitbasket-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 백필
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
          KAMIS_PROXY_URL: ${{ secrets.KAMIS_PROXY_URL }}
        run: python scripts/backfill.py --days "${{ inputs.days }}"

      - name: 최신 수집 + 리포트 재생성
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
          KAMIS_PROXY_URL: ${{ secrets.KAMIS_PROXY_URL }}
        run: |
          python scripts/collect.py
          python scripts/report.py

      - name: 커밋·푸시
        run: |
          git config user.name "fruitbasket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports
          git diff --cached --quiet || (git commit -m "과거 가격 백필 ${{ inputs.days }}일" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
